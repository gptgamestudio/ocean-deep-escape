<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40">
    <defs>
        <radialGradient id="droneCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="35%" stop-color="#00F0FF"/>
            <stop offset="80%" stop-color="#0077AA" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="droneHull" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4B1228"/>
            <stop offset="50%" stop-color="#240816"/>
            <stop offset="100%" stop-color="#0D0209"/>
        </linearGradient>
    </defs>

    <!-- Outer Sleek Stealth Disc -->
    <ellipse cx="50" cy="20" rx="46" ry="14" fill="url(#droneHull)" stroke="#FF0055" stroke-width="1.8"/>

    <!-- Perimeter Sensors (Cyan/Red dots along edge) -->
    <circle cx="16" cy="19" r="1.5" fill="#00F0FF"/>
    <circle cx="26" cy="17" r="1.5" fill="#00F0FF"/>
    <circle cx="36" cy="16" r="1.5" fill="#00F0FF"/>
    <circle cx="64" cy="16" r="1.5" fill="#00F0FF"/>
    <circle cx="74" cy="17" r="1.5" fill="#00F0FF"/>
    <circle cx="84" cy="19" r="1.5" fill="#00F0FF"/>

    <!-- Central Glowing Reactor Core -->
    <ellipse cx="50" cy="20" rx="14" ry="7" fill="url(#droneCore)"/>
    <ellipse cx="50" cy="20" rx="18" ry="9" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Navigation Red Beacons on Tips -->
    <circle cx="6" cy="20" r="2.5" fill="#FF0055"/>
    <circle cx="94" cy="20" r="2.5" fill="#FF0055"/>
</svg>
