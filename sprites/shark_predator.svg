<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 50" width="110" height="50">
    <defs>
        <linearGradient id="sharkDorsal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1B6CA8"/>
            <stop offset="50%" stop-color="#0F4C81"/>
            <stop offset="85%" stop-color="#072A4A"/>
            <stop offset="100%" stop-color="#E8F4F8"/>
        </linearGradient>
        <linearGradient id="sharkBelly" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#C5E3F6"/>
        </linearGradient>
    </defs>
    <!-- Tail (Facing Right because swimming Left) -->
    <path d="M85 25 L108 6 L98 25 L108 44 Z" fill="#0F4C81" stroke="#00D2FF" stroke-width="0.8"/>
    <!-- Dorsal Fin -->
    <path d="M62 16 L68 2 L54 4 L48 16 Z" fill="#0A365C" stroke="#00D2FF" stroke-width="0.8"/>
    <!-- Pectoral Fin -->
    <path d="M50 30 L62 46 L48 44 L40 32 Z" fill="#0A365C" stroke="#00D2FF" stroke-width="0.8"/>
    <!-- Main Muscular Body (Head facing LEFT) -->
    <path d="M88 25 C75 14 45 14 18 22 L2 25 C14 36 42 38 88 25 Z" fill="url(#sharkDorsal)" stroke="#00F0FF" stroke-width="1.2"/>
    <!-- White Belly (Bioluminescent Underbelly) -->
    <path d="M18 25 C30 33 55 35 84 27 C55 31 32 29 18 25 Z" fill="url(#sharkBelly)"/>
    <!-- Gills -->
    <line x1="38" y1="21" x2="39" y2="29" stroke="#051829" stroke-width="1.6"/>
    <line x1="34" y1="21" x2="35" y2="29" stroke="#051829" stroke-width="1.6"/>
    <line x1="30" y1="21" x2="31" y2="29" stroke="#051829" stroke-width="1.6"/>
    <!-- Lateral Sensor Line (Glowing Neon Cyan) -->
    <path d="M18 24 Q50 22 84 25" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
    <!-- Predatory Eye (Facing Left towards player) -->
    <circle cx="16" cy="22" r="3.2" fill="#FFCC00"/>
    <circle cx="15.5" cy="22" r="1.4" fill="#000000"/>
    <circle cx="15" cy="21.5" r="0.6" fill="#FFFFFF"/>
    <!-- Jaws & Razor Sharp White Teeth -->
    <path d="M20 28 L16 32 L12 28 L8 32 L4 28" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
</svg>
