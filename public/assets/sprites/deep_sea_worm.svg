    <ellipse cx="46" cy="118" rx="8.8" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="45" cy="106" rx="8.5" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="42" cy="94" rx="8.2" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="38" cy="82" rx="8" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="34" cy="70" rx="7.8" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="30" cy="58" rx="7.5" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="30" cy="46" rx="7.2" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="36" cy="34" rx="7" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <ellipse cx="44" cy="25" rx="6.5" ry="3.5" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- Tentacle / Feathery Feeding Plume Head -->
