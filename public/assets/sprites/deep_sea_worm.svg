    <path d="M 46 24 C 48 14, 52 10, 58 8" stroke="#FF70A6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 45 22 L 45 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="10" r="2.5" fill="#00F0FF"/>
    <circle cx="58" cy="8" r="2.5" fill="#00F0FF"/>
    <circle cx="45" cy="5" r="3" fill="#00F0FF"/>
