<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 140" width="90" height="140">
    <defs>
        <linearGradient id="wormBody" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF5D8F"/>
            <stop offset="40%" stop-color="#FF0055"/>
            <stop offset="100%" stop-color="#590D22"/>
