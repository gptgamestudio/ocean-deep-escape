<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
    <defs>
        <!-- Bell radial glow -->
        <radialGradient id="jellyBell" cx="50%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#9B5DE5" stop-opacity="0.75"/>
            <stop offset="85%" stop-color="#00F0FF" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
        </radialGradient>
        <!-- Inner organ glow -->
        <radialGradient id="innerOrgan" cx="50%" cy="40%" r="40%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#FF0077" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
        </radialGradient>
        <!-- Tentacle stroke gradient -->
        <linearGradient id="tentacleGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
            <stop offset="40%" stop-color="#FF70A6" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2"/>
        </linearGradient>
    </defs>

    <!-- Translucent Outer Bell Dome -->
    <path d="M 15 55 C 15 15, 105 15, 105 55 C 105 68, 90 68, 80 64 C 70 60, 65 66, 60 64 C 55 66, 50 60, 40 64 C 30 68, 15 68, 15 55 Z" 
          fill="url(#jellyBell)" stroke="#00F0FF" stroke-width="1.8"/>

    <!-- Inner Bioluminescent Core -->
    <path d="M 35 48 C 35 30, 85 30, 85 48 C 85 58, 70 56, 60 54 C 50 56, 35 58, 35 48 Z" 
          fill="url(#innerOrgan)"/>

    <!-- Vertical Rhopalia / Luminous Ridges -->
    <path d="M 30 52 C 32 32, 45 22, 60 20" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.7" fill="none"/>
    <path d="M 90 52 C 88 32, 75 22, 60 20" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.7" fill="none"/>
    <path d="M 60 54 L 60 20" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.8" fill="none"/>

    <!-- Luminous Margin Beads -->
    <circle cx="22" cy="59" r="2" fill="#00F0FF"/>
    <circle cx="38" cy="62" r="2.2" fill="#FF70A6"/>
    <circle cx="60" cy="63" r="2.5" fill="#FFFFFF"/>
    <circle cx="82" cy="62" r="2.2" fill="#FF70A6"/>
    <circle cx="98" cy="59" r="2" fill="#00F0FF"/>

    <!-- Trailing Tentacles with Flowing Sinusoidal Curves -->
    <path d="M 28 64 C 20 85, 36 110, 24 145" stroke="url(#tentacleGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 40 64 C 48 90, 32 115, 42 152" stroke="url(#tentacleGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 52 64 C 46 88, 62 120, 50 156" stroke="url(#tentacleGrad)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 68 64 C 74 88, 58 120, 70 156" stroke="url(#tentacleGrad)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 80 64 C 72 90, 88 115, 78 152" stroke="url(#tentacleGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 92 64 C 100 85, 84 110, 96 145" stroke="url(#tentacleGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Oral Arms (Central Frilly Tentacles) -->
    <path d="M 48 64 C 54 80, 46 100, 52 125 C 55 135, 48 145, 52 150" stroke="#FF0077" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
    <path d="M 72 64 C 66 80, 74 100, 68 125 C 65 135, 72 145, 68 150" stroke="#FF0077" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
</svg>
